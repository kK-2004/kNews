schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
rules:
  proposal:
    - proposal 中的每个 capability（New 或 Modified）对应的需求，均须同步写入 docs/需求文档.md 的对应章节。具体规则：
      - New Capabilities → 在 docs/需求文档.md 中新增编号连续的功能需求章节（如 F09、F10），包含编号表格和描述
      - Modified Capabilities → 更新 docs/需求文档.md 中已有章节的对应条目
      - 同步时机：proposal 创建或更新时立即同步，不得延后到实现阶段
      - 需求编号规则：延续文档中已有的最大编号递增（如当前最大 F08，下一个从 F09 开始）
